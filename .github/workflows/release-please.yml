name: release-please

# Релиз создаётся на каждом мерже в main: пуш запускает workflow,
# release-please открывает релизный PR, а на мерж этого PR ставит тег и
# GitHub Release. Руками ничего запускать не нужно. workflow_dispatch оставлен
# для перепрогона, если первый упал.
#
# Корневого package.json нет намеренно — версия живёт в vite-project/package.json.
#
# Токен — GITHUB_TOKEN, поэтому события от созданного ботом релизного PR не
# порождают прогонов: ci.yml и hexlet-check на нём не поедут. Если это нужно —
# заменить на PAT-секрет.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Два быстрых пуша подряд не должны запускать релиз параллельно: второй
# прогон либо молча уйдёт («There are untagged, merged release PRs outstanding
# - aborting»), либо напорется на «Duplicate release tag». Отменять нечего —
# релиз должен довестись до конца.
#
# Оговорка к workflow_dispatch: GitHub отменяет ранее ОЖИДАЮЩИЙ прогон в группе
# независимо от cancel-in-progress, выживает только новейший. Ручной запуск,
# случившийся при живом прогоне пуша, молча потеряется — запускать его надо после
# завершения пуша.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # release-type не указан: при наличии release-please-config.json
      # включается манифестный режим автоматически
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
