name: Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    # Как в opencode-review.yml и opencode-scheduled.yml: зависший агент
    # жёг бы раннер все шесть часов вместо двадцати минут.
    timeout-minutes: 20
    permissions:
      # Только комментарий к задаче: issues на запись, остальное на чтение.
      # contents: write и pull-requests: write убраны намеренно — триаж не
      # коммитит и не открывает PR, а без прав на запись не может этого
      # сделать даже при ошибке в промпте.
      issues: write
      contents: read
    steps:
      - name: Check account age
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const user = await github.rest.users.getByUsername({
              username: context.payload.issue.user.login
            });
            const created = new Date(user.data.created_at);
            const days = (Date.now() - created) / (1000 * 60 * 60 * 24);
            return days >= 30;
          result-encoding: string

      - uses: actions/checkout@v6
        if: steps.check.outputs.result == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      # Пин на SHA, а не на тег: джоб получает секрет и право комментировать
      # задачи. SHA взят из прогона 38401499078 — та же версия, что в
      # opencode-review.yml и opencode-scheduled.yml.
      - uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        if: steps.check.outputs.result == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/space-bunny-free
          use_github_token: true
          # Флаг не задан → шэринг включается неявно: репозиторий публичный,
          # а текст задачи и транскрипт ушли бы на публичный opencode.ai.
          share: false
          prompt: |
            Задача этого прогона: оценить новую задачу в этом
            репозитории и оставить не более одного комментария —
            только если оценка получается конкретной.

            Правила оформления коммитов из AGENTS.md на этот прогон
            не распространяются: ни AGENTS.md, ни соглашения о коммитах
            не дают тебе права что-либо коммитить. Твоё единственное
            действие — комментарий к этой задаче, не более одного.

            Запрещено: git commit, git push, создание ветки, pull
            request, правка файлов. Если кажется, что нужен фикс, —
            опиши его словами в комментарии, но не делай.

            Молчание — нормальный исход. Оставь комментарий, только
            если выполнены оба условия:
            1. В тексте задачи есть конкретный вопрос или дефект,
               понятный без догадок.
            2. В репозитории есть материал, отвечающий на него:
               AGENTS.md, README.md, docs/ или код.

            Если условия не выполнены, промолчи. Если сведений не
            хватает, задай в комментарии один уточняющий вопрос
            вместо догадки. Не выдумывай ссылки на документацию и
            не пересказывай тему задачи.

            Комментарий пиши по-русски и кратко: что делать автору
            и ссылка на конкретный файл или раздел.