name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/space-bunny-free
          # Без установленного GitHub App приложения токен берётся из самого workflow:
          # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} вместо id-token, use_github_token: true.
          # share: true
          # Задача приходит в комментарии, которым запущен бот, — промпт ниже
          # добавляет к этому требования к коммиту.
          prompt: |
            Выполни задачу из комментария, которым тебя вызвали.

            Изменения закоммить одним коммитом, сообщение которого соответствует
            conventional commits: `тип(область): описание`. Область — vite-project
            или server, если меняется только один модуль; для правок корня —
            без области. Описание — по-русски, в отглагольной форме, без точки
            в конце, вместе с префиксом не длиннее 100 символов.

            Текст комментария в сообщение коммита не копируй: без типа и описания
            его отвергнёт хук commit-msg, и бот упадёт до пуша. Полные правила
            — в AGENTS.md в корне репозитория.
